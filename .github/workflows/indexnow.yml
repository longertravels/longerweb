name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages to build
        run: sleep 90

      - name: Submit all sitemap URLs to IndexNow
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error

          KEY = "4612dc97039f81d0e325856be6e0c577"
          HOST = "longertravels.com"

          xml = open("sitemap.xml", encoding="utf-8").read()
          urls = re.findall(r"<loc>([^<]+)</loc>", xml)
          print(f"found {len(urls)} urls")

          payload = {
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("IndexNow status:", r.status)
          except urllib.error.HTTPError as e:
              print("IndexNow HTTP error:", e.code, e.read().decode("utf-8", "ignore"))
          PY
